name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    # Build the image and smoke-test it: the container must answer /predict.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t anomaly-detector:ci .

      - name: Smoke test container
        run: |
          PAYLOAD=$(python -c 'import json; print(json.dumps({"Time": 50000, "Amount": 15, **{f"V{i}": 0 for i in range(1, 29)}}))')
          docker run -d --name app -p 8080:8080 anomaly-detector:ci
          for i in $(seq 1 30); do
            if curl -sf -X POST localhost:8080/predict \
                 -H 'Content-Type: application/json' \
                 -d "$PAYLOAD"; then
              echo; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

  deploy:
    # Only deploy pushes to main, and only after tests and the image build pass.
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets GitHub issue an OIDC token for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        # Builds the Dockerfile with Cloud Build and deploys the image.
        run: |
          gcloud run deploy anomaly-detector \
            --source . \
            --region "${{ vars.GCP_REGION }}" \
            --no-allow-unauthenticated \
            --quiet
